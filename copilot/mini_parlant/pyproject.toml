[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-parlant"
version = "0.1.0"
description = "A lightweight context optimization framework inspired by Parlant"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "context", "optimization", "parlant", "nlp"]
dependencies = []   # zero mandatory runtime deps

[project.optional-dependencies]
dev = ["pytest>=7"]
siliconflow = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_parlant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
